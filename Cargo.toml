[package]
name = "linea-stark-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bin"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    "air",
    "bin",
    "trace"
]

[workspace.dependencies]
p3-challenger = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-air = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-field = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-matrix = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-merkle-tree = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-maybe-rayon = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-commit = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-dft = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-fri = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-symmetric = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-uni-stark = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-util = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }
p3-bls12-377-fr = { git = "https://github.com/distributed-lab/Plonky3/", branch = "feature/public-symbolic-air-builder" }

tracing-subscriber = { version = "0.3.17", features = ["std", "env-filter"] }
tracing-forest = { version = "0.1.6", features = ["ansi", "smallvec"] }
rand = "0.8.5"
ark-ff = { git = "https://github.com/distributed-lab/algebra.git", branch = "master" }
num-bigint = { version = "0.4.6", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
ciborium = "0.2.2"


[workspace.dependencies.config]
parallel = ["p3-maybe-rayon/parallel"]
